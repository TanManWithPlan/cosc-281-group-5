/**:
  ros__parameters:
    # A suggested development setting, not permission to move the car.
    # 0.30 m/s needs the Medium profile (press Y once, stopped, nothing held);
    # in Low the safety node scales treads down to 0.15 m/s.
    requested_forward_speed_m_s: 0.30

    # Speed-scaled steering (yaw = -gain * speed * offset). Robot-5 curve tests
    # tracked well at ~8 per metre for 0.10-0.45 m/s. 0.0 = use steering_gain_rad_s.
    steering_gain_per_m: 8.0
    max_yaw_rate_rad_s: 2.4

    # Look-ahead band within the bottom-third ROI (0 = far edge, 1 = nearest row).
    # Lower band = turn later; lower coverage = stop later at a road end.
    # The band slides from the slow band (<= 0.30 m/s) to the fast band (>= 0.80 m/s)
    # so faster driving looks farther ahead and reacts in time.
    lookahead_band_top: 0.45
    lookahead_band_bottom: 0.85
    lookahead_fast_band_top: 0.15
    lookahead_fast_band_bottom: 0.55
    lookahead_slow_speed_m_s: 0.30
    lookahead_fast_speed_m_s: 0.80
    lookahead_min_coverage: 0.3

    # Keep following the held estimate for up to road_lost_timeout_s when the
    # road briefly disappears, at this fraction of speed.
    follow_while_holding: true
    holding_speed_scale: 0.6

    # --- Route memory (Guillermo) ---
    # off: no route I/O; record: save a new route while driving; replay: load a
    # saved route and use its advice (slow before known curves / road-lost spots).
    # Read at startup only.
    route_mode: "off"
    route_file: "~/.ros/team_navigation/routes/test_route.json"
    route_overwrite: false
    route_save_interval_s: 1.0

    # Recording resolution
    route_spacing_m: 0.05
    route_cell_m: 0.10

    # Replay matching and lookahead
    route_lookahead_m: 0.50
    route_match_window_m: 0.40
    route_max_match_m: 0.30

    # How strongly replay advice changes speed: 0 = ignore (log only), 1 = full.
    # speed_scale = 1 - weight * (1 - advice). Live-settable.
    route_advice_weight: 1.0

    # Sensor freshness gates for recording and replay advice
    max_imu_age_s: 0.25
    max_encoder_age_s: 0.25
